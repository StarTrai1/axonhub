name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - unstable
      - development
      - 'release/**'
  pull_request:
    branches:
      - dev
      - unstable
      - development
      - 'release/**'

env:
  GO111MODULE: on

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
          cache: true

      - name: Build main binary
        run: go build -ldflags "-s -w" -tags=nomsgpack -o axonhub ./cmd/axonhub

      - name: Verify production dependency graph
        run: |
          ./scripts/verify-go-sse-dependency-test.sh
          ./scripts/verify-go-sse-dependency.sh ./axonhub

      - name: Build schema generator
        run: cd cmd/schema && go build -o schema


  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Go for embedded asset tests
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum

      - name: Build frontend
        run: |
          node --test scripts/pack-frontend.test.mjs
          make build-frontend
          go test ./internal/server/static
