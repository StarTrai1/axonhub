# Copy from https://github.com/spf13/cobra
# https://github.com/spf13/cobra/blob/master/LICENSE.txt
name: Test
on:
  workflow_dispatch:
    inputs:
      format_base:
        description: Base revision for changed Go formatting (optional)
        required: false
        default: HEAD^
        type: string
  push:
    branches:
      - "dev"
      - "unstable"
      - "release/**"
  pull_request:
    branches:
      - "unstable"
      - "release/**"
env:
  GO111MODULE: on
jobs:
  test-windows-websocket-proxy:
    name: Windows WebSocket SOCKS and reset recovery (loopback only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Verify Winsock classification and real WSS through SOCKS
        run: go test ./internal/server/orchestrator -run '^(TestWindowsWebSocketConnectionReset|TestWebSocketSOCKSChannelRetry|TestRetryTransportClassification|TestRetryTransportPipeline)$' -count=1 -v
      - name: Verify SOCKS aliases and cancellation on Windows
        working-directory: llm
        run: go test ./transformer/openai/responses -run '^(TestWebSocketProxyAliasesDialThroughSOCKS|TestWebSocketSOCKSCancellation)$' -count=1 -v

  test-codex-probe-scripts:
    name: Test Codex probe scripts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify isolated lifecycle and scheduling with a fake CLI
        run: python -m unittest discover -s scripts/codex-probes -p 'test_*.py' -v

  test-codex-cli-compatibility:
    name: Codex ${{ matrix.codex }} / ${{ matrix.model }} concurrency (loopback only)
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.161.0', '0.162.0']
        model: [gpt-6-sol, gpt-6.1-sol]
    env:
      PROBE_TEST_MODEL: ${{ matrix.model }}
      PROBE_TEST_CODEX_VERSION: ${{ matrix.codex }}
      AXONHUB_CODEX_RETRY_FIXTURE: /tmp/codex-retry-failure.sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download pinned official standalone package
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ matrix.codex }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-fixture"
          gh release download "rust-v$CODEX_VERSION" --repo openai/codex --pattern codex-package-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/codex-fixture"
          tar -xzf "$RUNNER_TEMP/codex-fixture/codex-package-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/codex-fixture"
          codex_binary=$(find "$RUNNER_TEMP/codex-fixture" -type f -path '*/bin/codex' -print -quit)
          test -n "$codex_binary"
          echo "PROBE_TEST_CODEX=$codex_binary" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        if: matrix.codex == '0.162.0'
        with:
          go-version: stable
      - name: Export the gateway retry failure for the real CLI
        if: matrix.codex == '0.162.0'
        run: go test ./internal/server/api -run '^TestCodex162RetryFixture$' -count=1
      - name: Verify real CLI concurrency against a local mock
        run: python -m unittest discover -s scripts/codex-probes -p 'test_cli_integration.py' -v

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axonhub_test
          POSTGRES_PASSWORD: axonhub_test
          POSTGRES_DB: axonhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axonhub_test -d axonhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify generation and changed Go formatting
        env:
          FORMAT_BASE: ${{ inputs.format_base || 'HEAD^' }}
        run: |
          make generate
          git diff --name-only -z --diff-filter=ACMRT "$FORMAT_BASE" HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > "$RUNNER_TEMP/generated.patch"
          git diff --stat
          test ! -s "$RUNNER_TEMP/generated.patch"

      - name: Preserve generated source differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: generated-source-differences
          path: ${{ runner.temp }}/generated.patch
          if-no-files-found: ignore

      - name: Test
        run: make test-backend-all

      - name: Verify PostgreSQL quota routing migration
        env:
          AXONHUB_TEST_PG_DSN: postgres://axonhub_test:axonhub_test@127.0.0.1:5432/axonhub_test?sslmode=disable
        run: go test ./internal/server/biz -run '^TestQuotaRoutingMigration_Postgres$' -count=1 -v

      - name: Responses concurrency regression
        run: |
          go test -race ./internal/server/orchestrator -run 'TestWebSocketSOCKSChannelRetry|TestCaptureRawProviderStream|TestPassThroughAnthropicStream|TestRawStreamBacklog|TestResponsesSession|TestResponsesRejected|TestResponsesCompactionRecovery|TestChannelRejectsFailedStreamEvenAfterText|TestSealedLocalCompaction|TestLegacyLocalCompaction' -count=1
          go test -race ./internal/server/biz -run '^TestSystemServiceResponsesMetadata|^TestChannelMetrics_ConcurrentReadsAndWrites$' -count=1
          go test -race ./internal/server/api -run '^TestResponsesWebSocket(Warmup|Heartbeat|Auth|Interrupt)' -count=1
          cd llm
          go test -race ./pipeline -run 'TestFirstOutput' -count=1
          go test -race ./transformer/openai/responses -run 'TestWebSocketSOCKSCancellation|TestWebSocketExecutorSeparatesCodexExecutionScopes|TestCodexExecutionPoolIdentity' -count=1

      - name: Responses cache benchmarks
        run: go test ./internal/server/orchestrator -run '^$' -bench '^BenchmarkResponsesSession' -benchmem -count=3 | tee responses-cache-benchmarks.txt

      - name: Upload Responses cache benchmarks
        uses: actions/upload-artifact@v6
        with:
          name: responses-cache-benchmarks
          path: responses-cache-benchmarks.txt

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      # The *.test.mjs suites import .ts modules directly, which needs native
      # TypeScript type stripping (enabled by default since Node 22.18).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: frontend
        run: pnpm test:unit

      - name: Install browser for isolated UI regressions
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify overlay lifecycle and navigation
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.interactions.config.ts

      - name: Upload UI regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-interaction-failures
          path: frontend/test-results
