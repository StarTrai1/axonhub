# Copy from https://github.com/spf13/cobra
# https://github.com/spf13/cobra/blob/master/LICENSE.txt
name: Test
on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run optional cache benchmarks
        type: boolean
        default: false
      format_base:
        description: Base revision for changed Go formatting (optional)
        required: false
        default: HEAD^
        type: string
  push:
    branches:
      - "dev"
      - "unstable"
      - "release/**"
  pull_request:
    branches:
      - dev
      - "unstable"
      - "release/**"
env:
  GO111MODULE: on
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  test-windows-websocket-proxy:
    name: Windows transport and durable recovery
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - name: Verify Windows transport, SQLite and native continuation
        run: go test ./internal/server/orchestrator ./internal/server/api ./cmd/axonhub -run 'TestWindowsWebSocketConnectionReset|TestWebSocketSOCKSChannelRetry|TestHTTP2FallbackPipeline|TestUnifiedHistory.*(Rollback|Restart|Canceled|TokenAdmission)|TestUnifiedHistoryProtocol|TestResponsesProtocolCompactionRelay|TestAgentRecoveryCLI' -count=1
      - name: Verify Windows SOCKS and stream cancellation
        working-directory: llm
        run: go test ./transformer/openai/responses -run 'TestWebSocketProxyAliasesDialThroughSOCKS|TestWebSocketSOCKSCancellation|TestWebSocketStreamCloseWhileNextBlocked' -count=1

  test-codex-probe-scripts:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    name: Test Codex probe scripts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify isolated lifecycle and scheduling with a fake CLI
        run: python -m unittest discover -s scripts/codex-probes -p 'test_*.py' -v

  test-codex-cli-compatibility:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    name: Codex ${{ matrix.codex }} / ${{ matrix.model }} concurrency (loopback only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {codex: '0.162.1', model: gpt-6-sol}
          - {codex: '0.163.0', model: gpt-6.1-sol}
    env:
      PROBE_TEST_MODEL: ${{ matrix.model }}
      PROBE_TEST_CODEX_VERSION: ${{ matrix.codex }}
      AXONHUB_CODEX_RETRY_FIXTURE: /tmp/codex-retry-failure.sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download pinned official standalone package
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ matrix.codex }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-fixture"
          gh release download "rust-v$CODEX_VERSION" --repo openai/codex --pattern codex-package-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/codex-fixture"
          tar -xzf "$RUNNER_TEMP/codex-fixture/codex-package-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/codex-fixture"
          codex_binary=$(find "$RUNNER_TEMP/codex-fixture" -type f -path '*/bin/codex' -print -quit)
          test -n "$codex_binary"
          echo "PROBE_TEST_CODEX=$codex_binary" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - name: Export the gateway retry failure for the real CLI
        run: go test ./internal/server/api -run '^TestCodex162RetryFixture$' -count=1
      - name: Verify real CLI concurrency against a local mock
        run: python -m unittest discover -s scripts/codex-probes -p 'test_cli_integration.py' -v

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axonhub_test
          POSTGRES_PASSWORD: axonhub_test
          POSTGRES_DB: axonhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axonhub_test -d axonhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Share the verified toolchain with Build, Lint and Release.
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum

      - name: Test
        run: go test ./...

      - name: Verify PostgreSQL quota routing migration
        env:
          AXONHUB_TEST_PG_DSN: postgres://axonhub_test:axonhub_test@127.0.0.1:5432/axonhub_test?sslmode=disable
        run: go test ./internal/server/biz -run '^TestQuotaRoutingMigration_Postgres$|^TestUnifiedHistory.*Postgres$' -count=1 -v

  test-llm:
    name: Test LLM module
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - name: Test all LLM packages
        working-directory: llm
        run: go test ./...

  source-contract:
    name: Verify generated sources and modules
    needs: changes
    if: needs.changes.outputs.generation == 'true' || needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - name: Verify generation and changed Go formatting
        env:
          CHECK_DEPENDENCIES: ${{ needs.changes.outputs.dependencies }}
          CHECK_GENERATION: ${{ needs.changes.outputs.generation }}
          FORMAT_BASE: ${{ inputs.format_base || 'HEAD^' }}
        run: |
          if [ "$CHECK_DEPENDENCIES" = true ]; then
            go mod tidy
            (cd llm && go mod tidy)
            (cd cmd/schema && go mod tidy)
          fi
          if [ "$CHECK_GENERATION" = true ]; then
            make generate
          fi
          git diff --name-only -z --diff-filter=ACMRT "$FORMAT_BASE" HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > "$RUNNER_TEMP/generated.patch"
          git diff --stat
          test ! -s "$RUNNER_TEMP/generated.patch"

      - name: Preserve generated source differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: generated-source-differences
          path: ${{ runner.temp }}/generated.patch
          if-no-files-found: ignore

  concurrency:
    name: Targeted concurrency checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - name: Verify concurrent storage and gateway lifecycles
        run: go test -race -timeout 15m ./internal/server/orchestrator ./internal/server/biz ./internal/server/api -run 'Test.*(Concurrent|Concurrency|Race|Canceled|Cancellation|Singleflight|Flight|CloseWhileNext|Interrupt|TokenMeasureImages)' -count=1
      - name: Verify transport concurrency
        working-directory: llm
        run: go test -race ./httpclient ./pipeline ./transformer/openai/responses ./transformer/openai/codex -run 'Test.*(Concurrent|Concurrency|Race|Cancel|CloseWhileNext|Interrupt|ExecutionPoolIdentity|SeparatesCodexExecutionScopes)' -count=1

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
            cmd/schema/go.sum
      - run: go test ./internal/server/orchestrator -run '^$' -bench '^BenchmarkResponsesSession|^BenchmarkUnifiedHistoryCompression' -benchmem -count=1 | tee responses-cache-benchmarks.txt
      - uses: actions/upload-artifact@v6
        with:
          name: responses-cache-benchmarks
          path: responses-cache-benchmarks.txt

  test-frontend-unit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Test Frontend Unit
    # Keep the runner compatible with the browser version in pnpm-lock.yaml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      # The *.test.mjs suites import .ts modules directly, which needs native
      # TypeScript type stripping (enabled by default since Node 22.18).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: frontend
        run: pnpm test:unit

      - name: Install browser for isolated UI regressions
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify overlay lifecycle and navigation
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.interactions.config.ts

      - name: Upload UI regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-interaction-failures
          path: frontend/test-results
