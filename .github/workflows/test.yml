# Copy from https://github.com/spf13/cobra
# https://github.com/spf13/cobra/blob/master/LICENSE.txt
name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - "dev"
      - "unstable"
      - "release/**"
  pull_request:
    branches:
      - "unstable"
      - "release/**"
env:
  GO111MODULE: on
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: make test-backend-all

      - name: Responses concurrency regression
        run: |
          go test -race ./internal/server/orchestrator -run 'TestResponsesSession|TestResponsesRejected|TestScheduledHealth|TestSealedLocalCompaction|TestLegacyLocalCompaction' -count=1
          go test -race ./internal/server/biz -run '^TestSystemServiceResponsesMetadata' -count=1
          go test -race ./internal/server/api -run '^TestResponsesWebSocketWarmup' -count=1
          cd llm
          go test -race ./pipeline -run 'TestFirstOutput' -count=1
          go test -race ./transformer/openai/responses -run 'TestWebSocketExecutorSeparatesCodexExecutionScopes|TestCodexExecutionPoolIdentity' -count=1

      - name: Responses cache benchmarks
        run: go test ./internal/server/orchestrator -run '^$' -bench '^BenchmarkResponsesSession' -benchmem -count=3 | tee responses-cache-benchmarks.txt

      - name: Upload Responses cache benchmarks
        uses: actions/upload-artifact@v6
        with:
          name: responses-cache-benchmarks
          path: responses-cache-benchmarks.txt

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      # The *.test.mjs suites import .ts modules directly, which needs native
      # TypeScript type stripping (enabled by default since Node 22.18).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: frontend
        run: pnpm test:unit
