name: Checkpoint resume diagnosis
on:
  push:
    branches: [fix/20261111-agent-checkpoint-resume]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            llm/go.sum
      - run: go test ./internal/server/orchestrator -run '^TestCheckpointRecoveryResumesAfterCanceledAncestor$' -count=1 -v
