name: Verify unified continuation preparation
on:
  push:
    branches: [ci/history-windows-20261020-v2]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axonhub_test
          POSTGRES_PASSWORD: axonhub_test
          POSTGRES_DB: axonhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axonhub_test -d axonhub_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Prepare formatting and generation
        env:
          FORMAT_BASE: 430e5170b4f0e303f0a4ad1c11ac857e9e0a558c
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/daixiang0/gci@latest
          go install mvdan.cc/gofumpt@latest
          git diff --name-only -z --diff-filter=ACMRT "$FORMAT_BASE" HEAD -- '*.go' | xargs -0 -r "$(go env GOPATH)/bin/goimports" -w
          git diff --name-only -z --diff-filter=ACMRT "$FORMAT_BASE" HEAD -- '*.go' | xargs -0 -r "$(go env GOPATH)/bin/gci" write -s standard -s default -s blank -s dot -s alias -s localmodule --custom-order
          git diff --name-only -z --diff-filter=ACMRT "$FORMAT_BASE" HEAD -- '*.go' | xargs -0 -r "$(go env GOPATH)/bin/gofumpt" -w
      - name: Preserve preparation patch
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/prepared.patch"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: peers-prepared-patch
          path: ${{ runner.temp }}/prepared.patch
      - name: Lint root changes
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 10m --max-same-issues 50 --new-from-rev=430e5170b4f0e303f0a4ad1c11ac857e9e0a558c
      - name: Repeat canceled SQLite recovery
        run: go test -race ./internal/server/orchestrator -run '^TestUnifiedHistory(CanceledColdPlanStopsLaunchingSegments|FailedPlanDoesNotRegenerateSiblingsOnResend)$' -count=12 -v
      - name: Verify compaction recovery races
        run: |
          go test -race ./internal/server/orchestrator -run 'TestUnifiedHistory|TestResponsesRejectedNativeSource|TestNativeCompactionMigration|TestRemoteCompaction|TestResponsesCompaction|TestResponsesSession|TestResponsesRejected|TestCodexMemory|TestCollectLocalCompactionBridge' -count=1 -v
          go test -race ./internal/server/api -run 'TestUnifiedHistory|TestResponsesProtocol(NativeCompactionMigration|CompactionRelay|AutoCompaction|EncryptedAgentCompaction)' -count=1 -v
          go test -race ./internal/server/biz -run 'TestRequestServiceLoadCompletedResponsesSession|TestUnifiedHistory' -count=1 -v
      - name: Verify pipeline continuation and stream errors
        working-directory: llm
        run: go test -race ./pipeline ./transformer/openai/responses ./transformer/anthropic ./transformer/antigravity -count=1
      - name: Verify history configuration
        run: |
          go test ./conf -run 'TestRetiredUnifiedHistory|TestUnifiedHistory' -count=1 -v
          go test -race ./internal/server/biz -run 'TestBundledModelContextLimit|TestChannelOverrideConcurrentInitialization' -count=1 -v
      - name: Verify PostgreSQL history transactions
        env:
          AXONHUB_TEST_PG_DSN: postgres://axonhub_test:axonhub_test@127.0.0.1:5432/axonhub_test?sslmode=disable
        run: go test -race ./internal/server/biz -run '^TestUnifiedHistory.*Postgres$' -count=1 -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Verify Windows compaction recovery
        run: go test ./internal/server/orchestrator ./internal/server/api -run 'TestUnifiedHistory|TestResponsesSessionRestores|TestCodexMemory|TestRemoteCompactionRequires|TestResponsesCompactionRejection|TestNativeCompactionMigrationReusesAncestorEvidence|TestRemoteCompactionEvidenceDestinationIsolation|TestResponsesProtocolNativeCompactionMigrationFromWebSocketDelta' -count=1 -v
