<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Match ThemeProvider defaults before the first stylesheet can paint.
      (() => {
        let theme = 'system';
        let colorScheme = 'claude';
        try {
          const savedTheme = localStorage.getItem('axonhub-ui-theme');
          const savedColorScheme = localStorage.getItem('axonhub-ui-color-scheme');
          if (['light', 'dark', 'system'].includes(savedTheme)) theme = savedTheme;
          if (['blue', 'green', 'purple', 'orange', 'red', 'black', 'cream', 'claude', 'starry'].includes(savedColorScheme)) {
            colorScheme = savedColorScheme;
          }
        } catch {
          // Storage can be unavailable in restricted browser contexts.
        }
        const effectiveTheme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        document.documentElement.classList.add(effectiveTheme, colorScheme);
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>AxonHub</title>
    <meta name="title" content="AxonHub" />
    <meta name="description" content="AxonHub is a platform that enable AI agent developer to build their own AI agent." />

    <!-- <script src="https://cdn.jsdelivr.net/npm/react-scan/dist/auto.global.js"></script> -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AxonHub" />
    <meta property="og:description" content="AxonHub is a platform that enable AI agent developer to build their own AI agent." />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@100..800&family=Manrope:wght@200..800&family=Montserrat:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Serif+4:opsz,wght@8..60,200..900&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@100..800&family=Manrope:wght@200..800&family=Montserrat:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Serif+4:opsz,wght@8..60,200..900&display=swap"
      />
    </noscript>

    <meta name="theme-color" content="#fff" />
  </head>

  <body class="group/body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
